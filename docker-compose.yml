services:
  postgres:
    image: postgres:16-alpine
    container_name: landini-postgres
    restart: unless-stopped
    # env_file (not just `environment` below) so the init scripts under
    # database/init/ can read ETL_WRITER_PASSWORD/DASHBOARD_READER_PASSWORD
    # via psql's \getenv (see 001_roles.sql).
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Bound to localhost only — not reachable from outside the host. On
    # the server, connect via `docker compose exec postgres psql ...`; in
    # dev, `localhost:${DB_PORT}` still works for an external client.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  streamlit:
    # Root build context: this image embeds the etl package too, so the
    # "Aggiorna dati" button can import and call it in-process (see
    # streamlit/Dockerfile).
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    container_name: landini-streamlit
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  etl:
    build: ./etl
    container_name: landini-etl
    env_file: .env
    environment:
      DB_HOST: postgres
    volumes:
      - ./etl/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    # Under a profile so a plain `docker compose up` (postgres + streamlit)
    # never launches it: run on demand with
    # `docker compose run --rm etl python -m app.main ...` (that still
    # works despite the profile — Compose always allows a service named
    # explicitly on the command line), or `docker compose --profile etl up`.
    profiles: ["etl"]
    restart: "no"

volumes:
  postgres_data:
