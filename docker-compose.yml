services:
  postgres:
    image: postgres:16-alpine
    container_name: landini-postgres
    restart: unless-stopped
    # env_file (not just `environment` below) so the init scripts under
    # database/init/ can read ETL_WRITER_PASSWORD/DASHBOARD_READER_PASSWORD
    # via psql's \getenv (see 001_roles.sql).
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Bound to localhost only — not reachable from outside the host. Host
    # side uses DB_PORT (5435 by default, matching the native Windows
    # production Postgres) so an external client (psql, pgAdmin, a native
    # non-Docker run of this app) always connects the same way in dev and
    # in production; container-to-container traffic inside the Docker
    # network still uses Postgres' real internal port, 5432 — see the
    # explicit DB_PORT override on the streamlit/etl services below.
    ports:
      - "127.0.0.1:${DB_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  streamlit:
    # Root build context: this image installs landini_etl too (unified
    # pyproject.toml/uv.lock), so the "Aggiorna dati" button can import and
    # call it in-process (see streamlit/Dockerfile).
    build:
      context: .
      dockerfile: streamlit/Dockerfile
    container_name: landini-streamlit
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside the Docker network: the Postgres service name, and its real
      # internal port (not DB_PORT from .env, which is the host-side
      # mapping above — see the ports: comment on postgres).
      DB_HOST: postgres
      DB_PORT: "5432"
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  etl:
    # Root build context: needs pyproject.toml/uv.lock/src/ from the repo
    # root (see etl/Dockerfile), same as streamlit.
    build:
      context: .
      dockerfile: etl/Dockerfile
    container_name: landini-etl
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
    volumes:
      - ./src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    # Under a profile so a plain `docker compose up` (postgres + streamlit)
    # never launches it: run on demand with
    # `docker compose run --rm etl uv run python -m landini_etl.main ...`
    # (that still works despite the profile — Compose always allows a
    # service named explicitly on the command line), or
    # `docker compose --profile etl up`.
    profiles: ["etl"]
    restart: "no"

volumes:
  postgres_data:
