[project]
name = "landini-dashboard"
version = "0.1.0"
description = "Landini Dashboard: Takeoff CRM -> ETL -> PostgreSQL -> Streamlit"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.31.0",
    "pydantic-settings>=2.6.0",
    "psycopg2-binary>=2.9.9",
    "streamlit>=1.63.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landini_etl"]
